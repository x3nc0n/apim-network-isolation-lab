name: Validate lab (no Azure deployment)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Bicep compiler
        run: az bicep install --version v0.49.2
      - name: Compile and require committed ARM to match source
        shell: pwsh
        run: ./scripts/Test-Lab.ps1
